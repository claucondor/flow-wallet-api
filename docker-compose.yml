# ==============================================================================
# Unified Docker Compose with Profiles
# Usage:
#   docker-compose --profile dev up          # Development mode
#   docker-compose --profile prod up         # Production mode  
#   docker-compose --profile lightweight up  # Lightweight mode
#   docker-compose --profile test up         # Test mode
#   docker-compose --profile docs up         # Documentation only
# ==============================================================================

version: "3.9"

networks:
  private:
    driver: bridge
  public:
    driver: bridge

volumes:
  postgres_data:
  redis_data: 
  emulator_data:
  wallet_data:

# ==============================================================================
# SERVICES
# ==============================================================================
services:

  # ==========================================================================
  # API SERVICES
  # ==========================================================================
  
  # Main API (Current)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-api-production}
    container_name: flow-wallet-api
    profiles: ["api", "dev", "prod", "test"]
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      # Database
      - FLOW_WALLET_DATABASE_TYPE=${DATABASE_TYPE:-postgres}
      - FLOW_WALLET_DATABASE_DSN=${DATABASE_DSN:-postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable}
      # Flow
      - FLOW_WALLET_ACCESS_API_HOST=${ACCESS_API_HOST:-emulator:3569}
      - FLOW_WALLET_CHAIN_ID=${CHAIN_ID:-flow-emulator}
      # Admin
      - FLOW_WALLET_ADMIN_ADDRESS=${ADMIN_ADDRESS:-0xf8d6e0586b0a20c7}
      - FLOW_WALLET_ADMIN_PRIVATE_KEY=${ADMIN_PRIVATE_KEY:-91a22fbd87392b019fbe332c32695c14cf2ba5b6521476a8540228bdf1987068}
      - FLOW_WALLET_ENCRYPTION_KEY=${ENCRYPTION_KEY:-faae4ed1c30f4e4555ee3a71f1044a8e}
      # Features
      - FLOW_WALLET_ENABLED_TOKENS=${ENABLED_TOKENS:-FlowToken:0x0ae53cb6e3f42a79:flowToken,FUSD:0xf8d6e0586b0a20c7:fusd}
      # Mode specific
      - FLOW_WALLET_LIGHTWEIGHT_MODE=${LIGHTWEIGHT_MODE:-false}
      - FLOW_WALLET_QUAVE_MODE=${QUAVE_MODE:-false}
      # Redis (disabled in lightweight mode)
      - FLOW_WALLET_DISABLE_IDEMPOTENCY_MIDDLEWARE=${DISABLE_IDEMPOTENCY:-false}
      - FLOW_WALLET_IDEMPOTENCY_MIDDLEWARE_REDIS_URL=${REDIS_URL:-redis://redis:6379}
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emulator:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API V2 (Future)
  api-v2:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-v2-production
    container_name: flow-wallet-api-v2
    profiles: ["api-v2", "dev"]
    ports:
      - "${API_V2_PORT:-3001}:3001"
    environment:
      # Same as API but different port
      - FLOW_WALLET_PORT=3001
      - FLOW_WALLET_DATABASE_TYPE=${DATABASE_TYPE:-postgres}
      - FLOW_WALLET_DATABASE_DSN=${DATABASE_DSN:-postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable}
      - FLOW_WALLET_ACCESS_API_HOST=${ACCESS_API_HOST:-emulator:3569}
      - FLOW_WALLET_CHAIN_ID=${CHAIN_ID:-flow-emulator}
      - FLOW_WALLET_ADMIN_ADDRESS=${ADMIN_ADDRESS:-0xf8d6e0586b0a20c7}
      - FLOW_WALLET_ADMIN_PRIVATE_KEY=${ADMIN_PRIVATE_KEY:-91a22fbd87392b019fbe332c32695c14cf2ba5b6521476a8540228bdf1987068}
      - FLOW_WALLET_ENCRYPTION_KEY=${ENCRYPTION_KEY:-faae4ed1c30f4e4555ee3a71f1044a8e}
      - FLOW_WALLET_ENABLED_TOKENS=${ENABLED_TOKENS:-FlowToken:0x0ae53cb6e3f42a79:flowToken,FUSD:0xf8d6e0586b0a20c7:fusd}
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
      emulator:
        condition: service_started
    restart: unless-stopped

  # Admin Tools
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin-production
    container_name: flow-wallet-admin
    profiles: ["admin", "dev"]
    environment:
      - FLOW_WALLET_DATABASE_TYPE=${DATABASE_TYPE:-postgres}
      - FLOW_WALLET_DATABASE_DSN=${DATABASE_DSN:-postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable}
      - FLOW_WALLET_ACCESS_API_HOST=${ACCESS_API_HOST:-emulator:3569}
      - FLOW_WALLET_ADMIN_ADDRESS=${ADMIN_ADDRESS:-0xf8d6e0586b0a20c7}
      - FLOW_WALLET_ADMIN_PRIVATE_KEY=${ADMIN_PRIVATE_KEY:-91a22fbd87392b019fbe332c32695c14cf2ba5b6521476a8540228bdf1987068}
      - FLOW_WALLET_ENCRYPTION_KEY=${ENCRYPTION_KEY:-faae4ed1c30f4e4555ee3a71f1044a8e}
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./admin", "-command=migrate"]  # Default command

  # Lightweight API (SQLite only)
  api-lightweight:
    build:
      context: .
      dockerfile: Dockerfile
      target: lightweight
    container_name: flow-wallet-api-lightweight
    profiles: ["lightweight"]
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      # Lightweight mode with configurable database
      - FLOW_WALLET_LIGHTWEIGHT_MODE=${LIGHTWEIGHT_MODE:-true}
      - FLOW_WALLET_DATABASE_TYPE=${DATABASE_TYPE:-sqlite}
      - FLOW_WALLET_DATABASE_DSN=${DATABASE_DSN:-/data/wallet.db}
      - FLOW_WALLET_DISABLE_IDEMPOTENCY_MIDDLEWARE=${DISABLE_IDEMPOTENCY:-true}
      # Flow
      - FLOW_WALLET_ACCESS_API_HOST=${ACCESS_API_HOST:-emulator:3569}
      - FLOW_WALLET_CHAIN_ID=${CHAIN_ID:-flow-emulator}
      # Admin
      - FLOW_WALLET_ADMIN_ADDRESS=${ADMIN_ADDRESS:-0xf8d6e0586b0a20c7}
      - FLOW_WALLET_ADMIN_PRIVATE_KEY=${ADMIN_PRIVATE_KEY:-91a22fbd87392b019fbe332c32695c14cf2ba5b6521476a8540228bdf1987068}
      - FLOW_WALLET_ENCRYPTION_KEY=${ENCRYPTION_KEY:-faae4ed1c30f4e4555ee3a71f1044a8e}
      - FLOW_WALLET_ENABLED_TOKENS=${ENABLED_TOKENS:-FlowToken:0x0ae53cb6e3f42a79:flowToken}
    volumes:
      - wallet_data:/data
    networks:
      - private
    depends_on:
      emulator:
        condition: service_started
    restart: unless-stopped

  # ==========================================================================
  # DATABASE SERVICES  
  # ==========================================================================

  # PostgreSQL
  postgres:
    image: postgres:13-alpine
    container_name: flow-wallet-postgres
    profiles: ["dev", "prod", "test", "api", "api-v2", "admin"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wallet}
      POSTGRES_USER: ${POSTGRES_USER:-wallet}  
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallet} -d ${POSTGRES_DB:-wallet}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis  
  redis:
    image: redis:6.2-alpine
    container_name: flow-wallet-redis
    profiles: ["dev", "prod", "api"] # Not in lightweight
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server /usr/local/etc/redis/redis.conf --loglevel warning
    volumes:
      - ./redis-config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis-config/users.acl:/usr/local/etc/redis/users.acl:ro
      - redis_data:/data
    networks:
      - private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================================================
  # BLOCKCHAIN SERVICES
  # ==========================================================================

  # Flow Emulator
  emulator:
    image: gcr.io/flow-container-registry/emulator:latest
    container_name: flow-emulator
    profiles: ["dev", "prod", "test", "lightweight", "api", "api-v2"]
    ports:
      - "${EMULATOR_PORT:-3569}:3569"
      - "${EMULATOR_REST_PORT:-8888}:8888"
    command: emulator start --persist --verbose --port=3569 --rest-port=8888 --block-time=1s
    volumes:
      - emulator_data:/flowdb
      - ./flow:/flow:ro
    networks:
      - private
    restart: unless-stopped
    environment:
      FLOW_SERVICEPRIVATEKEY: ${FLOW_SERVICE_PRIVATE_KEY:-}
      FLOW_SERVICEKEYSIGALGO: ${FLOW_SERVICE_KEY_SIG_ALGO:-ECDSA_P256}
      FLOW_SERVICEKEYHASHALGO: ${FLOW_SERVICE_KEY_HASH_ALGO:-SHA3_256}

  # ==========================================================================
  # UTILITY SERVICES
  # ==========================================================================

  # Documentation
  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    container_name: flow-wallet-docs
    profiles: ["docs", "dev"]
    ports:
      - "${DOCS_PORT:-8080}:3000"
    environment:
      NODE_ENV: production
    networks:
      - public
    restart: unless-stopped

  # PgAdmin (Development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: flow-wallet-pgadmin
    profiles: ["dev"]
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: flow-wallet-nginx
    profiles: ["prod"]
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - public
      - private
    depends_on:
      - api
    restart: unless-stopped

# ==============================================================================
# PROFILES DOCUMENTATION
# ==============================================================================
# 
# Available profiles:
#
# dev        - Full development stack (Postgres + Redis + PgAdmin + API + Emulator + Docs)
# prod       - Production stack with Nginx (Postgres + Redis + API + Emulator + Nginx)
# lightweight - Minimal stack (SQLite + API + Emulator, no Redis)
# test       - Testing stack (Postgres + API + Emulator)
# api        - Just the API with dependencies (Postgres + Redis + API + Emulator)
# api-v2     - API V2 with dependencies
# admin      - Admin tools with database
# docs       - Documentation only
#
# Usage examples:
# docker-compose --profile dev up
# docker-compose --profile prod up -d
# docker-compose --profile lightweight up
# docker-compose --profile test up --abort-on-container-exit